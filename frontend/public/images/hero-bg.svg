<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1530"/>
      <stop offset="55%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#070b17"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161f3d"/>
      <stop offset="100%" stop-color="#0b1224"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#f97316" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd8a8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd8a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Converging corridor floor -->
  <polygon points="0,1080 1920,1080 1180,430 740,430" fill="url(#floor)" opacity="0.9"/>
  <!-- Ceiling -->
  <polygon points="0,0 1920,0 1180,300 740,300" fill="#070b17" opacity="0.85"/>

  <!-- Floor seams -->
  <g stroke="#2a355c" stroke-width="1.5" opacity="0.5">
    <line x1="960" y1="1080" x2="960" y2="430"/>
    <line x1="480" y1="1080" x2="820" y2="430"/>
    <line x1="1440" y1="1080" x2="1100" y2="430"/>
    <line x1="160" y1="1080" x2="770" y2="430"/>
    <line x1="1760" y1="1080" x2="1150" y2="430"/>
  </g>

  <!-- Left glass panel wall -->
  <g opacity="0.9">
    <polygon points="0,120 740,300 740,1000 0,980" fill="url(#panel)"/>
    <g stroke="#3a4670" stroke-width="1" opacity="0.55">
      <line x1="90" y1="150" x2="90" y2="965"/>
      <line x1="220" y1="185" x2="220" y2="945"/>
      <line x1="360" y1="215" x2="360" y2="920"/>
      <line x1="510" y1="250" x2="510" y2="895"/>
      <line x1="640" y1="278" x2="640" y2="875"/>
    </g>
  </g>

  <!-- Right glass panel wall -->
  <g opacity="0.9">
    <polygon points="1920,120 1180,300 1180,1000 1920,980" fill="url(#panel)"/>
    <g stroke="#3a4670" stroke-width="1" opacity="0.55">
      <line x1="1830" y1="150" x2="1830" y2="965"/>
      <line x1="1700" y1="185" x2="1700" y2="945"/>
      <line x1="1560" y1="215" x2="1560" y2="920"/>
      <line x1="1410" y1="250" x2="1410" y2="895"/>
      <line x1="1280" y1="278" x2="1280" y2="875"/>
    </g>
  </g>

  <!-- Pendant lights receding down the corridor -->
  <g>
    <circle cx="960" cy="120" r="70" fill="url(#lightGlow)"/>
    <rect x="945" y="60" width="30" height="10" rx="3" fill="#d9dee8" opacity="0.5"/>
    <circle cx="960" cy="120" r="10" fill="#ffe3b8"/>

    <circle cx="860" cy="215" r="46" fill="url(#lightGlow)" opacity="0.85"/>
    <circle cx="860" cy="215" r="7" fill="#ffe3b8" opacity="0.9"/>

    <circle cx="1075" cy="215" r="46" fill="url(#lightGlow)" opacity="0.85"/>
    <circle cx="1075" cy="215" r="7" fill="#ffe3b8" opacity="0.9"/>

    <circle cx="960" cy="330" r="34" fill="url(#lightGlow)" opacity="0.6"/>
    <circle cx="960" cy="330" r="5" fill="#ffe3b8" opacity="0.75"/>
  </g>

  <!-- Soft vertical vignette so foreground text stays readable -->
  <rect width="1920" height="1080" fill="#0b1224" opacity="0.35"/>
  <linearGradient id="leftFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0b1224" stop-opacity="0.85"/>
    <stop offset="45%" stop-color="#0b1224" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#0b1224" stop-opacity="0"/>
  </linearGradient>
  <rect width="1920" height="1080" fill="url(#leftFade)"/>
</svg>
